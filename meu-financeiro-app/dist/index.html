    <script>
      // tema e modo escuro guardados neste aparelho, aplicados antes da primeira pintura (sem piscar)

        var raiz = document.documentElement;
        var barras = { azul: "#0f172a", verde: "#022c22", roxo: "#2e1065", dourado: "#1c1917" };
        var a = null;
        try {
          a = JSON.parse(localStorage.getItem("meu_financeiro_aparencia") || "null");
        } catch (e) {}
        var tema = a && barras[a.tema] ? a.tema : "azul";
        var escuro = !!(a && a.escuro === true);

        raiz.setAttribute("data-modo", escuro ? "escuro" : "claro");
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", escuro ? "#0b1220" : barras[tema]);
      })();
    </script>
