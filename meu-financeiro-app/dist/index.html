<!doctype html>
<html lang="pt-BR" data-tema="azul" data-modo="claro" data-estilo="classico">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="description" content="Controle financeiro pessoal: cartões, contas, metas e investimentos, com IA." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icons/icone.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Meu Financeiro</title>
    <script>
      // estilo, tema e modo escuro guardados neste aparelho, aplicados antes da primeira pintura (sem piscar)
      (function () {
        var raiz = document.documentElement;
        var barras = { azul: "#0f172a", verde: "#022c22", roxo: "#2e1065", violeta: "#1b1b8f", dourado: "#1c1917" };
        var barrasBanco = { azul: "#2563eb", verde: "#047857", roxo: "#7c3aed", violeta: "#3b3bf5", dourado: "#b45309" };
        var a = null;
        try {
          a = JSON.parse(localStorage.getItem("meu_financeiro_aparencia") || "null");
        } catch (e) {}
        var tema = a && barras[a.tema] ? a.tema : "azul";
        var escuro = !!(a && a.escuro === true);
        raiz.setAttribute("data-tema", tema);
        var estilo = a && (a.estilo === "banco" || a.estilo === "vidro") ? a.estilo : "classico";
        raiz.setAttribute("data-modo", escuro ? "escuro" : "claro");
        raiz.setAttribute("data-estilo", estilo);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", estilo === "banco" && !escuro ? barrasBanco[tema] : escuro ? "#0b1220" : barras[tema]);
      })();
    </script>
    <script type="module" crossorigin src="/assets/index-SnJGbjF2.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-BNpTuTFO.css">
  </head>
  <body>
    <style>
      /* tela de abertura (some quando o app desenha): ícone e nome na cor do tema escolhido */
      .abertura{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:var(--ab-fundo,#2a1fa8);color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
      .abertura img{width:88px;height:88px;border-radius:24px;box-shadow:0 14px 40px rgba(0,0,0,.35)}
      .abertura b{font-size:20px;letter-spacing:-.2px}
      .abertura i{width:28px;height:28px;border-radius:50%;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;animation:abgira .9s linear infinite}
      @keyframes abgira{to{transform:rotate(360deg)}}
      @media (prefers-reduced-motion:reduce){.abertura i{animation:none}}
      [data-tema="azul"]{--ab-fundo:#1d4ed8}[data-tema="verde"]{--ab-fundo:#065f46}[data-tema="roxo"]{--ab-fundo:#5b21b6}
      [data-tema="violeta"]{--ab-fundo:#2a1fa8}[data-tema="dourado"]{--ab-fundo:#1c1917}[data-modo="escuro"]{--ab-fundo:#0b1220}
    </style>
    <div id="root"><div class="abertura" role="status" aria-label="Abrindo o Meu Financeiro"><img src="/icons/icon-192.png" alt="" /><b>Meu Financeiro</b><i></i></div></div>
  </body>
</html>
